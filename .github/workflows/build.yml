name: Build AssetStudioMod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clone AssetStudioMod
        run: git clone --branch AssetStudioMod https://github.com/aelurum/AssetStudio.git src

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Patch csproj files to add net10.0
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Filter "*.csproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            # Add net10.0-windows alongside net9.0-windows
            $content = $content -replace 'net9\.0-windows', 'net9.0-windows;net10.0-windows'
            # Add net10.0 alongside net9.0 (but not where -windows already handled it)
            $content = $content -replace ';net9\.0(?!-)', ';net9.0;net10.0'
            Set-Content $_.FullName $content
            Write-Host "Patched $($_.Name)"
          }

      - name: Download FBX SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path fbx | Out-Null
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbx/fbxsdk.exe"
          Start-Process -FilePath "fbx/fbxsdk.exe" /S -Wait
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_pdbs.exe" -OutFile "fbx/fbxpdb.exe"
          Start-Process -FilePath "fbx/fbxpdb.exe" /S -Wait

      - name: Build native C++ projects (Texture2DDecoderNative)
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Filter "*.vcxproj" | ForEach-Object {
            Write-Host "Building $($_.FullName)"
            msbuild $_.FullName /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
            msbuild $_.FullName /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal
          }

      - name: Print Texture2DDecoderNative csproj references (debug)
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Recurse -Filter "*.csproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match 'Texture2DDecoderNative') {
              Write-Host "=== $($_.FullName) ==="
              # Print lines mentioning Texture2DDecoder
              Get-Content $_.FullName | Select-String 'Texture2DDecoder'
            }
          }

      - name: Patch motion converter to handle SDK 5/6 OffscreenRendering bindings
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path src -Recurse -Filter "CubismMotion3Converter.cs" | Select-Object -First 1
          $content = Get-Content $file.FullName -Raw
          # Add OffscreenRendering cases before the closing brace of the script switch
          $content = $content -replace 
            '(case "CubismMouthController":.*?break;)(\s*\})',
            '$1
                          case "CubismOffscreenRenderTexture":
                          case "CubismMaskController":
                          case "CubismOffscreenRenderTextureConfig":
                              // SDK 5/6 rendering infrastructure - not motion data, skip silently
                              return;$2'
          Set-Content $file.FullName $content
          Write-Host "Patched CubismMotion3Converter for SDK 5/6 offscreen rendering bindings"

      - name: Patch Live2D SDK v6 unknown version guard
        shell: pwsh
        run: |
            $file = Get-ChildItem -Path src -Recurse -Filter "Live2DExtractor.cs" | Select-Object -First 1
            $content = Get-Content $file.FullName -Raw
            $content = $content -replace 
              '(Logger\.Warning\(\$"Live2D model.*?Unknown SDK version.*?\);)\s*\r?\n\s*return;',
              '$1'
            Set-Content $file.FullName $content
            Write-Host "Patched: removed return after unknown SDK version warning"

      - name: Restore NuGet packages
        working-directory: src
        run: dotnet restore

      - name: Publish GUI
        working-directory: src
        run: >
          dotnet publish AssetStudioGUI/AssetStudioGUI.csproj
          -c Release
          -f net10.0-windows
          --self-contained false
          -o "${{ github.workspace }}\publish-gui"
          /p:SolutionDir=..\
          /p:Platform=Win32
      
      - name: Publish CLI (net10.0)
        working-directory: src
        run: >
          dotnet publish AssetStudioCLI/AssetStudioCLI.csproj
          -c Release
          -f net10.0
          --self-contained false
          -o "${{ github.workspace }}\publish-cli"
          /p:SolutionDir=..\
          /verbosity:minimal

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioMod-GUI-net10
          path: publish-gui

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioMod-CLI-net10
          path: publish-cli